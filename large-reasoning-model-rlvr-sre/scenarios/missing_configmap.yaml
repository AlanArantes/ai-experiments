apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-settings
  namespace: sandbox-app
data:
  AUTH_MODE: "oauth2"
  # Fault: DB_POOL_SIZE is missing from the ConfigMap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sandbox-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth
        image: busybox:1.36
        command: ["sh", "-c", "echo Running with pool $POOL_SIZE; sleep 3600"]
        env:
        - name: AUTH_MODE
          valueFrom:
            configMapKeyRef:
              name: auth-settings
              key: AUTH_MODE
        - name: POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: auth-settings
              key: DB_POOL_SIZE  # Key does not exist
