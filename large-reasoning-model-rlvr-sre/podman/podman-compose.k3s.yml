version: "3.8"

services:
  k3s-sandbox:
    image: rancher/k3s:v1.31.0-k3s1
    container_name: k8s-sandbox-01
    privileged: true
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    ports:
      - "6443:6443"
    volumes:
      - ../k8s-output:/output:Z
    command: server --disable traefik --disable servicelb
